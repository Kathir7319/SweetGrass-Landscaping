<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="shieldGrad" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="60%" stop-color="#166534" />
      <stop offset="100%" stop-color="#052e16" />
    </linearGradient>

    <!-- Grass Blade 1 Gradient -->
    <linearGradient id="grass1" x1="32" y1="52" x2="18" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="50%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#86efac" />
    </linearGradient>

    <!-- Grass Blade 2 (Center) Gradient -->
    <linearGradient id="grass2" x1="32" y1="52" x2="32" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="60%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>

    <!-- Grass Blade 3 Gradient -->
    <linearGradient id="grass3" x1="32" y1="52" x2="48" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="55%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#86efac" />
    </linearGradient>

    <!-- Warm Amber Sun Gradient -->
    <linearGradient id="sunGlow" x1="38" y1="12" x2="50" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Stone Arc Gradient -->
    <linearGradient id="stoneArch" x1="16" y1="46" x2="48" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e2e8f0" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Squircle Base Emblem -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#shieldGrad)" />
  <rect x="4.5" y="4.5" width="55" height="55" rx="15.5" stroke="#4ade80" stroke-opacity="0.25" stroke-width="1" />

  <!-- Morning Sun / Glow (Warm Cary Sunrise) -->
  <circle cx="43" cy="18" r="7" fill="url(#sunGlow)" opacity="0.9" />
  <circle cx="43" cy="18" r="11" stroke="#fbbf24" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="2 3" />

  <!-- Hardscape Base / Stone Foundation Curve -->
  <path d="M14 50 C22 45, 42 45, 50 50" stroke="url(#stoneArch)" stroke-width="3.5" stroke-linecap="round" />
  <path d="M18 53 C26 49, 38 49, 46 53" stroke="url(#stoneArch)" stroke-width="2" stroke-linecap="round" opacity="0.6" />

  <!-- Left Graceful Grass Blade -->
  <path d="M32 50 C26 42, 17 32, 18 16 C22 28, 28 39, 32 50 Z" fill="url(#grass1)" />

  <!-- Right Sweeping Grass Blade -->
  <path d="M32 50 C36 41, 46 31, 46 17 C42 27, 36 38, 32 50 Z" fill="url(#grass3)" />

  <!-- Center Tall Sweetgrass Blade with Plume Tip -->
  <path d="M30.5 50 C30.5 35, 29.5 22, 32 9 C34.5 22, 33.5 35, 33.5 50 Z" fill="url(#grass2)" />

  <!-- Small Morning Dew Drop Accent -->
  <circle cx="21" cy="22" r="1.5" fill="#ffffff" opacity="0.8" />
</svg>
