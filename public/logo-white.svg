<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none">
  <defs>
    <linearGradient id="whiteShield" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="60%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#052e16" />
    </linearGradient>

    <linearGradient id="whiteGrass1" x1="32" y1="52" x2="18" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="50%" stop-color="#86efac" />
      <stop offset="100%" stop-color="#bbf7d0" />
    </linearGradient>

    <linearGradient id="whiteGrass2" x1="32" y1="52" x2="32" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="60%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>

    <linearGradient id="whiteGrass3" x1="32" y1="52" x2="48" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="55%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#86efac" />
    </linearGradient>

    <linearGradient id="whiteSun" x1="38" y1="12" x2="50" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="whiteStone" x1="16" y1="46" x2="48" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.15" />
    </linearGradient>
  </defs>

  <!-- EMBLEM GROUP -->
  <g transform="translate(2, 4)">
    <rect x="0" y="0" width="56" height="56" rx="16" fill="url(#whiteShield)" />
    <rect x="0.5" y="0.5" width="55" height="55" rx="15.5" stroke="#4ade80" stroke-opacity="0.35" stroke-width="1" />
    <circle cx="39" cy="14" r="7" fill="url(#whiteSun)" opacity="0.95" />
    <circle cx="39" cy="14" r="11" stroke="#fde047" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="2 3" />
    <path d="M10 46 C18 41, 38 41, 46 46" stroke="url(#whiteStone)" stroke-width="3.5" stroke-linecap="round" />
    <path d="M14 49 C22 45, 34 45, 42 49" stroke="url(#whiteStone)" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <path d="M28 46 C22 38, 13 28, 14 12 C18 24, 24 35, 28 46 Z" fill="url(#whiteGrass1)" />
    <path d="M28 46 C32 37, 42 27, 42 13 C38 23, 32 34, 28 46 Z" fill="url(#whiteGrass3)" />
    <path d="M26.5 46 C26.5 31, 25.5 18, 28 5 C30.5 18, 29.5 31, 29.5 46 Z" fill="url(#whiteGrass2)" />
    <circle cx="17" cy="18" r="1.5" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- TYPOGRAPHY GROUP (Light on Dark) -->
  <g transform="translate(70, 0)">
    <text x="0" y="36" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="28" fill="#ffffff" letter-spacing="-0.5">Sweet<tspan fill="#4ade80">Grass</tspan></text>
    
    <rect x="168" y="17" width="34" height="18" rx="4" fill="#052e16" stroke="#22c55e" stroke-width="1" />
    <text x="174" y="30" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="10" fill="#4ade80" letter-spacing="1">LLC</text>
    
    <text x="1" y="52" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="10.5" fill="#94a3b8" letter-spacing="2.2">LANDSCAPING • CARY, NC</text>
  </g>
</svg>
