<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none">
  <defs>
    <linearGradient id="fullShield" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="60%" stop-color="#166534" />
      <stop offset="100%" stop-color="#052e16" />
    </linearGradient>

    <linearGradient id="fullGrass1" x1="32" y1="52" x2="18" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="50%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#86efac" />
    </linearGradient>

    <linearGradient id="fullGrass2" x1="32" y1="52" x2="32" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#16a34a" />
      <stop offset="60%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>

    <linearGradient id="fullGrass3" x1="32" y1="52" x2="48" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="55%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#86efac" />
    </linearGradient>

    <linearGradient id="fullSun" x1="38" y1="12" x2="50" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="fullStone" x1="16" y1="46" x2="48" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e2e8f0" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- EMBLEM GROUP -->
  <g transform="translate(2, 4)">
    <rect x="0" y="0" width="56" height="56" rx="16" fill="url(#fullShield)" />
    <rect x="0.5" y="0.5" width="55" height="55" rx="15.5" stroke="#4ade80" stroke-opacity="0.25" stroke-width="1" />
    <circle cx="39" cy="14" r="7" fill="url(#fullSun)" opacity="0.9" />
    <circle cx="39" cy="14" r="11" stroke="#fbbf24" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="2 3" />
    <path d="M10 46 C18 41, 38 41, 46 46" stroke="url(#fullStone)" stroke-width="3.5" stroke-linecap="round" />
    <path d="M14 49 C22 45, 34 45, 42 49" stroke="url(#fullStone)" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <path d="M28 46 C22 38, 13 28, 14 12 C18 24, 24 35, 28 46 Z" fill="url(#fullGrass1)" />
    <path d="M28 46 C32 37, 42 27, 42 13 C38 23, 32 34, 28 46 Z" fill="url(#fullGrass3)" />
    <path d="M26.5 46 C26.5 31, 25.5 18, 28 5 C30.5 18, 29.5 31, 29.5 46 Z" fill="url(#fullGrass2)" />
    <circle cx="17" cy="18" r="1.5" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- TYPOGRAPHY GROUP -->
  <g transform="translate(70, 0)">
    <!-- "Sweet" in bold slate -->
    <text x="0" y="36" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="28" fill="#0f172a" letter-spacing="-0.5">Sweet<tspan fill="#16a34a">Grass</tspan></text>
    
    <!-- "LLC" Badge -->
    <rect x="168" y="17" width="34" height="18" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1" />
    <text x="174" y="30" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="10" fill="#15803d" letter-spacing="1">LLC</text>
    
    <!-- Subtitle: LANDSCAPING • CARY, NC -->
    <text x="1" y="52" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="10.5" fill="#64748b" letter-spacing="2.2">LANDSCAPING • CARY, NC</text>
  </g>
</svg>
